name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs a branch's checks, the Windows job included, without opening a PR.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build (release)
        run: cargo build --release

  windows:
    name: windows · fmt · clippy · test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The runner's git defaults to core.autocrlf=true. Off until reviewr reads worktree text
      # in git's canonical form; that change removes this step.
      - name: Line endings
        run: git config --global core.autocrlf false

      - name: Test
        run: cargo test --all-features

      - name: Build (release)
        run: cargo build --release

      # The build Windows QA runs: link a checkout with this in `bin\`.
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-reviewr-x86_64-pc-windows-msvc
          path: target/release/herdr-reviewr.exe
