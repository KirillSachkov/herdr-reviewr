# Own fork's plugin, linked beside the released persiyanov.reviewr (docs/own/decisions.md, decision 2).
# `just own-install` builds and places bin/herdr-reviewr here.
id = "kirill.reviewr"
name = "reviewr-own"
version = "0.46.0"
min_herdr_version = "0.9.3"
platforms = ["macos"]
description = "Own herdr-reviewr: session review, artifacts, reports and summary."

[[panes]]
id = "pane"
title = "reviewr"
placement = "split"
command = ["bin/herdr-reviewr"]

[[actions]]
id = "toggle"
title = "reviewr-own: toggle pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewr", "--action", "toggle"]

[[actions]]
id = "open"
title = "reviewr-own: open pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewr", "--action", "open"]

[[actions]]
id = "close"
title = "reviewr-own: close pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewr", "--action", "close"]

# Open a path from an agent's pane in reviewr (decision 19): Ctrl+click on an OSC 8 file link,
# or select a path and press the key bound to open-selection.
[[actions]]
id = "open-link"
title = "reviewr-own: open clicked file"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewr", "--action", "open-link"]

[[actions]]
id = "open-selection"
title = "reviewr-own: open selected path"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewr", "--action", "open-selection"]

[[link_handlers]]
id = "file"
title = "Open in reviewr"
pattern = "^file://"
action = "open-link"

[[link_handlers]]
id = "vscode-file"
title = "Open in reviewr"
pattern = "^vscode://file/"
action = "open-link"
